[package]
name = "wisp-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wisp"
path = "src/main.rs"

[[bin]]
name = "wispc"
path = "src/wispc.rs"

[features]
default = ["python"]
python = ["dep:wisp-python"]

[dependencies]
wisp-python = { path = "../wisp-python", optional = true }
wisp-syntax = { path = "../wisp-syntax" }
wisp-runtime = { path = "../wisp-runtime" }
wisp-llvm = { path = "../wisp-llvm" }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
